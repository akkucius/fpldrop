[project]
name = "fpldrop"
version = "0.1.0"
description = "Share your FPL team each gameweek with a proper pitch graphic and a ready caption. It posts to X today, and other social apps will follow."
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "httpx>=0.27",
    "jinja2>=3.1",
    "playwright>=1.45",
    "python-dotenv>=1.0",
    "tweepy>=4.14",
]

[project.scripts]
fpldrop = "fpldrop.cli:main"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
fpldrop = ["templates/*"]
